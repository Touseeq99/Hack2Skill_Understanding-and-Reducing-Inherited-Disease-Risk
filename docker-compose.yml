# Single-container demo: FastAPI + SQLite (the only database mode the prototype supports).
# PostgreSQL: infra/migrations/001_initial_schema.sql documents the target schema and row-level-security policies,
# but the application's SQL is SQLite-dialect, so a Postgres deployment needs a repository-layer port (see docs/SUBMISSION.md).
services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: inheritance-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/inheritance_platform.db
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-dGhpc19pc19hXzMyX2J5dGVfc2VjcmV0X2tleV9mb3JfZGVtb18=}
      AUTH_SECRET: ${AUTH_SECRET:-demo_insecure_jwt_secret_change_in_production}
      DEMO_OTP: ${DEMO_OTP:-123456}
      LLM_MODE: ${LLM_MODE:-template_only}
      APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data

volumes:
  appdata:
